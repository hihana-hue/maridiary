<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💰 용돈 기입장</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
  body { min-height: 100vh; background: #0d0d17; display: flex; align-items: center; justify-content: center; padding: 20px; }

  .blob1 { position: fixed; top: -100px; right: -100px; width: 350px; height: 350px; border-radius: 50%; background: radial-gradient(circle, rgba(99,102,241,0.18) 0%, transparent 70%); pointer-events: none; }
  .blob2 { position: fixed; bottom: -80px; left: -80px; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(34,197,94,0.12) 0%, transparent 70%); pointer-events: none; }

  .card { width: 100%; max-width: 420px; background: rgba(17,17,30,0.97); border: 1px solid rgba(255,255,255,0.07); border-radius: 24px; padding: 28px 24px; position: relative; z-index: 1; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }

  .header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .logo { font-size: 36px; }
  .title { font-size: 22px; font-weight: 900; color: #f9fafb; letter-spacing: -0.5px; }
  .subtitle { font-size: 12px; color: #6b7280; margin-top: 2px; }

  .login-section { display: flex; flex-direction: column; gap: 20px; }
  .login-label { font-size: 13px; color: #9ca3af; margin-bottom: 8px; }
  .user-btns { display: flex; gap: 10px; }
  .user-btn { flex: 1; padding: 18px 0; border-radius: 14px; border: 2px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); color: #9ca3af; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: 'Noto Sans KR', sans-serif; }
  .user-btn .user-emoji { font-size: 28px; }
  .user-btn:hover { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #f9fafb; }
  .user-btn.selected-mountain { border-color: #6366f1; background: rgba(99,102,241,0.15); color: #a5b4fc; }
  .user-btn.selected-river { border-color: #22c55e; background: rgba(34,197,94,0.12); color: #86efac; }

  .pw-input-row { display: flex; gap: 10px; }
  .pw-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 14px 16px; color: #f9fafb; font-size: 22px; letter-spacing: 8px; outline: none; text-align: center; font-family: monospace; width: 100%; }
  .pw-input:focus { border-color: rgba(255,255,255,0.3); }
  .pw-input::placeholder { letter-spacing: 2px; font-size: 13px; color: #4b5563; font-family: 'Noto Sans KR', sans-serif; }
  .login-btn { padding: 14px 18px; border-radius: 12px; border: none; background: #6366f1; color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; white-space: nowrap; }
  .login-btn:hover { background: #4f46e5; }
  .error-msg { font-size: 12px; color: #ef4444; text-align: center; min-height: 18px; margin-top: 4px; }

  .app-section { display: none; flex-direction: column; }
  .badge-row { display: flex; align-items: center; margin-bottom: 16px; }
  .user-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 100px; font-size: 12px; font-weight: 700; }
  .badge-mountain { background: rgba(99,102,241,0.2); color: #a5b4fc; border: 1px solid rgba(99,102,241,0.3); }
  .badge-river { background: rgba(34,197,94,0.15); color: #86efac; border: 1px solid rgba(34,197,94,0.25); }
  .logout-btn { background: none; border: none; color: #4b5563; font-size: 11px; cursor: pointer; margin-left: auto; font-family: 'Noto Sans KR', sans-serif; padding: 4px 8px; border-radius: 6px; }
  .logout-btn:hover { color: #9ca3af; }

  .balance-box { border-radius: 16px; padding: 16px 20px; margin-bottom: 20px; text-align: center; }
  .balance-box-mountain { background: rgba(99,102,241,0.08); border: 1px solid rgba(99,102,241,0.2); }
  .balance-box-river    { background: rgba(34,197,94,0.07);  border: 1px solid rgba(34,197,94,0.18); }
  .balance-label { font-size: 12px; color: #9ca3af; margin-bottom: 6px; letter-spacing: 1px; }
  .balance-amount { font-size: 32px; font-weight: 900; letter-spacing: -1px; transition: color 0.3s; }

  .toggle-wrap { display: flex; gap: 10px; margin-bottom: 20px; }
  .toggle-btn { flex: 1; padding: 12px 0; border-radius: 12px; border: none; font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.2s ease; font-family: 'Noto Sans KR', sans-serif; }
  .toggle-btn.income  { background: #22c55e; color: #fff; }
  .toggle-btn.expense { background: #ef4444; color: #fff; }
  .toggle-btn.inactive { background: #1e1e2e; color: #6b7280; }

  .form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
  input[type=text], input[type=date] { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 14px 16px; color: #f9fafb; font-size: 15px; outline: none; width: 100%; transition: border-color 0.2s; font-family: 'Noto Sans KR', sans-serif; }
  input[type=text]:focus, input[type=date]:focus { border-color: rgba(255,255,255,0.3); }
  input::placeholder { color: #4b5563; }
  input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; }

  .submit-btn { padding: 15px; border-radius: 12px; border: none; color: #fff; font-weight: 800; font-size: 16px; cursor: pointer; transition: all 0.2s ease; font-family: 'Noto Sans KR', sans-serif; }
  .submit-btn:disabled { background: #374151 !important; cursor: not-allowed; }

  .hist-title { font-size: 12px; color: #6b7280; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; }
  .entry-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: rgba(255,255,255,0.03); border-radius: 12px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.05); animation: fadeSlideItem 0.3s ease both; }
  .entry-left { display: flex; align-items: center; gap: 10px; }
  .entry-icon { font-size: 20px; }
  .entry-content { color: #e5e7eb; font-weight: 600; font-size: 14px; }
  .entry-date { color: #6b7280; font-size: 11px; margin-top: 2px; }
  .entry-amount { font-weight: 700; font-size: 15px; text-align: right; }
  .entry-balance { color: #6b7280; font-size: 11px; margin-top: 3px; text-align: right; }

  .notion-link { display: block; text-align: center; margin-top: 12px; font-size: 12px; color: #6b7280; text-decoration: none; }
  .notion-link:hover { color: #9ca3af; }
  .footer { margin-top: 12px; text-align: center; font-size: 11px; color: #374151; }

  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); color: #fff; font-weight: 700; font-size: 14px; padding: 12px 24px; border-radius: 100px; box-shadow: 0 8px 30px rgba(0,0,0,0.4); z-index: 999; white-space: nowrap; font-family: 'Noto Sans KR', sans-serif; animation: toastIn 0.3s ease; }

  @keyframes toastIn       { from { opacity: 0; bottom: 10px; } to { opacity: 1; bottom: 30px; } }
  @keyframes fadeSlideItem { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn        { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .app-section { animation: fadeIn 0.4s ease; }
</style>
</head>
<body>
<div class="blob1"></div>
<div class="blob2"></div>

<div class="card">
  <div class="header">
    <span class="logo">💰</span>
    <div>
      <div class="title">용돈 기입장</div>
      <div class="subtitle" id="header-subtitle">노션에 바로 저장돼</div>
    </div>
  </div>

  <!-- 로그인 화면 -->
  <div class="login-section" id="login-section">
    <div>
      <div class="login-label">👤 나는 누구?</div>
      <div class="user-btns">
        <button class="user-btn" id="btn-mountain" onclick="selectUser('mountain')">
          <span class="user-emoji">⛰️</span>Mountain
        </button>
        <button class="user-btn" id="btn-river" onclick="selectUser('river')">
          <span class="user-emoji">🌊</span>River
        </button>
      </div>
    </div>
    <div>
      <div class="login-label">🔑 비밀번호</div>
      <div class="pw-input-row">
        <input class="pw-input" type="password" id="pw-input" placeholder="비밀번호" maxlength="10" onkeydown="if(event.key==='Enter') doLogin()" />
        <button class="login-btn" onclick="doLogin()">입장 →</button>
      </div>
      <div class="error-msg" id="error-msg"></div>
    </div>
  </div>

  <!-- 메인 앱 -->
  <div class="app-section" id="app-section">
    <div class="badge-row">
      <div class="user-badge" id="user-badge"></div>
      <button class="logout-btn" onclick="doLogout()">로그아웃</button>
    </div>

    <div class="balance-box" id="balance-box">
      <div class="balance-label">현재 잔액</div>
      <div class="balance-amount" id="balance">0원</div>
    </div>

    <div class="toggle-wrap">
      <button class="toggle-btn expense" id="btn-expense" onclick="setType('지출')">－ 지출</button>
      <button class="toggle-btn inactive" id="btn-income" onclick="setType('수입')">＋ 수입</button>
    </div>

    <div class="form">
      <input type="text" id="content" placeholder="내용 (예: 편의점, 용돈 받음)" />
      <input type="text" id="amount" placeholder="금액 (원)" inputmode="numeric" oninput="formatAmount(this)" />
      <input type="date" id="date" />
      <button class="submit-btn" id="submit-btn" style="background:#ef4444" onclick="handleSubmit()">📒 노션에 저장</button>
    </div>

    <div id="history"></div>
    <a class="notion-link" id="notion-link" href="#" target="_blank">📋 노션에서 전체 기록 보기 →</a>
    <div class="footer" id="footer-text"></div>
  </div>
</div>

<script>
  const PASSWORD       = "7767";
  const NOTION_KEY     = "ntn_n89544272526ViG5XsMplqqR1AFDtciLdZqrQbZus5x4Hu";
  const NOTION_VERSION = "2022-06-28";
  const PROXY          = "https://corsproxy.io/?";

  const USERS = {
    mountain: {
      label:        "⛰️ Mountain",
      badgeClass:   "badge-mountain",
      balanceClass: "balance-box-mountain",
      dbId:         "828a7299d3844bbcb2c10418d8d79ce0",
      notionUrl:    "https://www.notion.so/828a7299d3844bbcb2c10418d8d79ce0"
    },
    river: {
      label:        "🌊 River",
      badgeClass:   "badge-river",
      balanceClass: "balance-box-river",
      dbId:         "5a80f9107f464cd2a882bc68fbe2f1a2",
      notionUrl:    "https://www.notion.so/5a80f9107f464cd2a882bc68fbe2f1a2"
    }
  };

  let selectedUser   = null;
  let loggedInUser   = null;
  let currentType    = "지출";
  let currentBalance = 0;
  let entries        = [];

  document.getElementById("date").value = new Date().toISOString().split("T")[0];

  /* ── 로그인 ── */
  function selectUser(user) {
    selectedUser = user;
    document.getElementById("btn-mountain").className = "user-btn" + (user === "mountain" ? " selected-mountain" : "");
    document.getElementById("btn-river").className    = "user-btn" + (user === "river"    ? " selected-river"    : "");
    document.getElementById("error-msg").textContent  = "";
    document.getElementById("pw-input").focus();
  }

  function doLogin() {
    const pw = document.getElementById("pw-input").value;
    if (!selectedUser)   { setError("먼저 이름을 선택해줘!"); return; }
    if (pw !== PASSWORD) { setError("비밀번호가 틀렸어! 🔒"); document.getElementById("pw-input").value = ""; return; }

    loggedInUser = selectedUser;
    const u = USERS[loggedInUser];

    const badge = document.getElementById("user-badge");
    badge.textContent = u.label;
    badge.className   = "user-badge " + u.badgeClass;

    document.getElementById("balance-box").className        = "balance-box " + u.balanceClass;
    document.getElementById("header-subtitle").textContent  = u.label + "의 용돈 기입장";
    document.getElementById("notion-link").href             = u.notionUrl;
    document.getElementById("footer-text").textContent      = u.label + " 노션 DB에 자동 저장";

    document.getElementById("login-section").style.display = "none";
    document.getElementById("app-section").style.display   = "flex";
  }

  function doLogout() {
    loggedInUser = null; selectedUser = null;
    currentBalance = 0; entries = [];
    document.getElementById("pw-input").value              = "";
    document.getElementById("btn-mountain").className      = "user-btn";
    document.getElementById("btn-river").className         = "user-btn";
    document.getElementById("error-msg").textContent       = "";
    document.getElementById("history").innerHTML           = "";
    document.getElementById("header-subtitle").textContent = "노션에 바로 저장돼";
    updateBalance();
    document.getElementById("app-section").style.display   = "none";
    document.getElementById("login-section").style.display = "flex";
  }

  function setError(msg) {
    const el = document.getElementById("error-msg");
    el.textContent = msg;
    setTimeout(() => { el.textContent = ""; }, 2500);
  }

  /* ── 앱 기능 ── */
  function setType(type) {
    currentType = type;
    const btnE = document.getElementById("btn-expense");
    const btnI = document.getElementById("btn-income");
    const sub  = document.getElementById("submit-btn");
    if (type === "지출") {
      btnE.className = "toggle-btn expense"; btnI.className = "toggle-btn inactive"; sub.style.background = "#ef4444";
    } else {
      btnI.className = "toggle-btn income";  btnE.className = "toggle-btn inactive"; sub.style.background = "#22c55e";
    }
  }

  function formatAmount(input) {
    const raw = input.value.replace(/[^0-9]/g, "");
    input.value = raw ? parseInt(raw).toLocaleString("ko-KR") : "";
  }

  function showToast(msg, ok = true) {
    const existing = document.querySelector(".toast");
    if (existing) existing.remove();
    const t = document.createElement("div");
    t.className = "toast";
    t.style.background = ok ? "#22c55e" : "#ef4444";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
  }

  function updateBalance() {
    const el = document.getElementById("balance");
    el.textContent = currentBalance.toLocaleString("ko-KR") + "원";
    el.style.color = currentBalance >= 0 ? "#22c55e" : "#ef4444";
  }

  function renderHistory() {
    const container = document.getElementById("history");
    if (entries.length === 0) { container.innerHTML = ""; return; }
    let html = '<div class="hist-title">이번 세션 기록</div>';
    entries.forEach(e => {
      const color = e.type === "수입" ? "#22c55e" : "#ef4444";
      const sign  = e.type === "수입" ? "+" : "-";
      const icon  = e.type === "수입" ? "📈" : "📉";
      html += `
        <div class="entry-row">
          <div class="entry-left">
            <span class="entry-icon">${icon}</span>
            <div>
              <div class="entry-content">${e.content}</div>
              <div class="entry-date">${e.date}</div>
            </div>
          </div>
          <div>
            <div class="entry-amount" style="color:${color}">${sign}${e.amount.toLocaleString("ko-KR")}원</div>
            <div class="entry-balance">잔액 ${e.balance.toLocaleString("ko-KR")}원</div>
          </div>
        </div>`;
    });
    container.innerHTML = html;
  }

  async function handleSubmit() {
    const content   = document.getElementById("content").value.trim();
    const amountRaw = document.getElementById("amount").value.replace(/,/g, "");
    const date      = document.getElementById("date").value;
    const amount    = parseInt(amountRaw, 10);

    if (!content) { showToast("내용을 입력해줘!", false); return; }
    if (!amountRaw || isNaN(amount) || amount <= 0) { showToast("올바른 금액을 입력해줘!", false); return; }

    const btn = document.getElementById("submit-btn");
    btn.disabled = true; btn.textContent = "저장 중...";

    const newBalance = currentType === "수입" ? currentBalance + amount : currentBalance - amount;
    const dbId       = USERS[loggedInUser].dbId;

    try {
      const url = PROXY + encodeURIComponent("https://api.notion.com/v1/pages");
      const response = await fetch(url, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + NOTION_KEY,
          "Content-Type": "application/json",
          "Notion-Version": NOTION_VERSION
        },
        body: JSON.stringify({
          parent: { database_id: dbId },
          properties: {
            "내용": { title: [{ text: { content: content } }] },
            "유형": { select: { name: currentType } },
            "금액": { number: amount },
            "날짜": { date:   { start: date } },
            "잔액": { number: newBalance }
          }
        })
      });

      if (!response.ok) {
        const err = await response.json();
        console.error(err);
        throw new Error("노션 오류");
      }

      currentBalance = newBalance;
      entries.unshift({ content, type: currentType, amount, date, balance: newBalance });
      updateBalance();
      renderHistory();
      document.getElementById("content").value = "";
      document.getElementById("amount").value  = "";
      document.getElementById("date").value    = new Date().toISOString().split("T")[0];
      showToast(USERS[loggedInUser].label + " 노션에 저장 완료! 📒");
    } catch (e) {
      console.error(e);
      showToast("저장 실패. 다시 시도해봐!", false);
    }

    btn.disabled = false;
    btn.textContent = "📒 노션에 저장";
  }

  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && loggedInUser) handleSubmit();
  });
</script>
</body>
</html>
